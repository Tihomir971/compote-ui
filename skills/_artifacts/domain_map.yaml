tensions:
  - name: 'Convenience wrappers versus Ark UI primitives'
    skills: ['component-usage', 'layout-and-display', 'overlays-and-floating-ui']
    description: 'Compote wrappers cover common cases, but some advanced patterns such as nested splitters require direct Ark UI primitive use.'
    implication: 'An agent may force the wrapper into an unsupported composition instead of dropping to Ark UI where needed.'
  - name: 'Core install versus optional feature peers'
    skills: ['getting-started', 'data-table', 'production-checklist']
    description: 'The root package can be used without table virtualization, but data-table subpaths require TanStack peers.'
    implication: 'An agent may over-install dependencies for simple apps or under-install them for data-table use.'
  - name: 'Theme defaults versus consumer overrides'
    skills: ['theming', 'component-usage', 'production-checklist']
    description: 'Components ship opinionated Tailwind styling but are intended to be rethemed through CSS variables and class merging.'
    implication: 'An agent may hard-code colors or replace classes, breaking consumer theming.'
  - name: 'Browser utilities versus SSR apps'
    skills: ['files-and-images', 'getting-started', 'production-checklist']
    description: 'Image processing utilities are exported from the package but are only safe in browser event handlers.'
    implication: 'An agent may call Canvas APIs in SvelteKit load functions or server modules.'

cross_references:
