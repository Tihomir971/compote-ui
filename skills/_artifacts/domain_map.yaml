library:
  name: 'compote-ui'
  version: '0.62.1'
  repository: ''
  description: 'Svelte 5 UI component library built on Ark UI, Tailwind CSS 4, and custom utility components.'
  primary_framework: 'Svelte'
maintainer_findings:
  - 'Consumer install guidance should show both npm install and bun add.'
  - 'Prefer fewer generated skills with reference files instead of many narrow component skills.'
  - 'Consumer stylesheet setup should import tailwindcss first, then compote-ui/theme.css.'
  - 'DataTable should not carry an explicit beta-risk warning.'
  - 'Component usage is the support area the maintainer expects to answer most often.'
  - 'Virtual DataTable differs mainly by import path and optional @tanstack/svelte-virtual peer.'
  - 'Charts are excluded because they belong to compote-echart.'
  - 'TipTap/editor functionality is excluded because it belongs to compote-editor.'

domains:
  - name: 'Starting Svelte apps with Compote UI'
    slug: 'starting-svelte-apps'
    description: 'Installing the package, importing theme CSS, satisfying peer dependencies, and rendering first components in SvelteKit.'
  - name: 'Using component groups'
    slug: 'using-component-groups'
    description: 'Choosing and composing exported components and utilities by UI task: forms, overlays, layout, display, interaction, files, and images.'
  - name: 'Customizing theme and styling'
    slug: 'customizing-theme-and-styling'
    description: 'Importing theme CSS, overriding Compote CSS variables, and using Tailwind utilities generated from theme tokens.'
  - name: 'Building data tables'
    slug: 'building-data-tables'
    description: 'Using the separate data-table subpath with TanStack Table v9 and optional TanStack Virtual.'
  - name: 'Shipping safely'
    slug: 'shipping-safely'
    description: 'Checking peer dependencies, SSR/browser boundaries, accessibility conventions, and repository verification commands before production.'

skills:
  - name: 'Getting started'
    slug: 'getting-started'
    domain: 'starting-svelte-apps'
    description: 'Install compote-ui in a SvelteKit app, import theme CSS, satisfy peer dependencies, and render first components.'
    type: 'lifecycle'
    covers:
      - 'npm package installation'
      - 'Svelte 5 peer dependency'
      - 'theme.css import order'
      - 'basic component imports from compote-ui'
      - 'Svelte 5 bind:value, bind:open, and snippet usage'
    tasks:
      - 'Install compote-ui and required peer dependencies'
      - 'Import compote-ui/theme.css with Tailwind CSS 4'
      - 'Render Button, Card, Field, Dialog, and other first components'
      - 'Set up Toast.Toaster once in a root layout'
    failure_modes:
      - mistake: 'Missing theme CSS import'
        mechanism: 'Components rely on theme.css for Tailwind token definitions and Compote CSS variables.'
        wrong_pattern: |
          @import 'tailwindcss';
        correct_pattern: |
          @import 'tailwindcss';
          @import 'compote-ui/theme.css';
        source: 'README.md, CLAUDE.md, src/lib/theme.css, existing compote-ui skill'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Using Svelte legacy props'
        mechanism: 'The library and examples assume Svelte 5 runes mode and bindable props.'
        wrong_pattern: |
          export let open = false;
          $: visible = open;
        correct_pattern: |
          let { open = $bindable(false) } = $props();
          const visible = $derived(open);
        source: 'CLAUDE.md, svelte.config.js'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Installing data table peers for every app'
        mechanism: 'DataTable is a separate subpath; apps that do not import it should not need TanStack Table or Virtual.'
        wrong_pattern: |
          bun add compote-ui @tanstack/svelte-table @tanstack/svelte-virtual
        correct_pattern: |
          bun add compote-ui
          # Add @tanstack/svelte-table only when importing compote-ui/data-table.
          # Add @tanstack/svelte-virtual only when importing compote-ui/data-table/virtual.
        source: 'package.json exports and peerDependenciesMeta, existing data-table reference'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'Component usage'
    slug: 'component-usage'
    domain: 'using-component-groups'
    description: 'Choose components and utilities from the public API, import them correctly, and follow the library composition patterns.'
    type: 'core'
    covers:
      - 'root compote-ui exports'
      - 'single components vs namespaced compound components'
      - 'collection utilities'
      - 'basic and advanced usage examples'
      - 'button and link button variants'
    tasks:
      - 'Find which component or utility to use for a UI task'
      - 'Import namespaced compound components correctly'
      - 'Use createListCollection and createTreeCollection for advanced collection cases'
      - 'Render icon-only buttons accessibly'
    reference_candidates:
      - topic: 'component reference matrix'
        reason: 'The root package exports many components and utility functions that agents need to route to the right pattern.'
    failure_modes:
      - mistake: 'Importing compound parts as root exports'
        mechanism: 'Compound components such as Dialog, Drawer, Field, Tabs, Menu, Card, and DataTable are exported as namespaces.'
        wrong_pattern: |
          import { DialogRoot, DialogTitle } from 'compote-ui';
        correct_pattern: |
          import { Dialog } from 'compote-ui';

          <Dialog.Root>
            <Dialog.Title>Title</Dialog.Title>
          </Dialog.Root>
        source: 'src/lib/index.ts, existing overlay/layout/form references'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Using arbitrary item shapes'
        mechanism: 'List-based components expect items with value and label fields so Ark UI collections can derive value and string text.'
        wrong_pattern: |
          const items = [{ id: 1, name: 'One' }];
          <Select {items} bind:value />
        correct_pattern: |
          const items = [{ value: 1, label: 'One' }];
          <Select {items} bind:value />
        source: 'src/lib/utils/collections.ts, existing form reference'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Icon-only button without label'
        mechanism: 'Icon-only controls need an accessible name because the visible icon is not enough.'
        wrong_pattern: |
          <Button size="icon"><SettingsIcon /></Button>
        correct_pattern: |
          <Button size="icon" aria-label="Settings">
            <SettingsIcon class="size-4" />
          </Button>
        source: 'existing button reference, CLAUDE.md accessibility guidance'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'Theming'
    slug: 'theming'
    domain: 'customizing-theme-and-styling'
    description: 'Set up and customize Compote UI theme tokens, Tailwind CSS 4 integration, dark/light mode, and component class overrides.'
    type: 'core'
    covers:
      - 'compote-ui/theme.css'
      - '@source for packaged components'
      - '@theme inline token mapping'
      - '--compote-* CSS variables'
      - 'light-dark() and .dark/.light overrides'
      - 'tailwind-variants cn helper'
    tasks:
      - 'Import theme.css into an app stylesheet'
      - 'Override brand color, radius, fonts, surfaces, text, and ring colors'
      - 'Force dark or light mode with html classes'
      - 'Use class props without replacing default component styles'
    failure_modes:
      - mistake: 'Adding duplicate dark media block'
        mechanism: 'The theme uses light-dark() plus color-scheme and .dark/.light classes, so duplicating variables in media queries fights the library model.'
        wrong_pattern: |
          @media (prefers-color-scheme: dark) {
            :root { --compote-surface-1: #111; }
          }
        correct_pattern: |
          :root {
            --compote-surface-1: light-dark(var(--gray-3), var(--gray-13));
          }
          .dark { color-scheme: dark; }
          .light { color-scheme: light; }
        source: 'CLAUDE.md, src/lib/theme.css'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Styling colored text as white'
        mechanism: 'Colored-background text should use text-ink-inverse so consumers can retheme it.'
        wrong_pattern: |
          <Button class="text-white">Save</Button>
        correct_pattern: |
          <Button class="text-ink-inverse">Save</Button>
        source: 'CLAUDE.md'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'Using primary for focus rings'
        mechanism: 'Focus rings should use ring-ring so consumers can override --compote-ring independently of --compote-primary.'
        wrong_pattern: |
          class="focus-visible:ring-primary"
        correct_pattern: |
          class="focus-visible:ring-ring"
        source: 'CLAUDE.md, src/lib/theme.css'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'Forms and inputs'
    slug: 'forms-and-inputs'
    domain: 'using-component-groups'
    description: 'Build forms with Field, Fieldset, Select, Combobox, Checkbox, Switch, NumberInput, date inputs, phone input, password input, and listbox.'
    type: 'core'
    covers:
      - 'Field.Root and form adapter integration'
      - 'Select, Combobox, and Listbox item collections'
      - 'Checkbox and CheckboxGroup'
      - 'Switch and NumberInput'
      - 'PhoneInput E.164 values'
      - 'DateField, DateRangeField, DateInput, DatePicker'
    tasks:
      - 'Build a validated form field'
      - 'Use list-based controls with item collections'
      - 'Choose the correct date component'
      - 'Bind phone values and validity'
      - 'Create grouped or filterable listboxes'
    reference_candidates:
      - topic: 'form component prop matrix'
        reason: 'Forms include many components with different bindable value types and validation surfaces.'
    failure_modes:
      - mistake: 'Using DatePicker as default date input'
        mechanism: 'DateField is the preferred accessible segmented date input; DatePicker is a simpler free-text calendar input.'
        wrong_pattern: |
          <DatePicker label="Date" bind:value />
        correct_pattern: |
          <DateField label="Date" bind:value />
        source: 'existing form reference'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Treating DateRangeField as DateField mode'
        mechanism: 'Range values use a different shape, so DateRangeField is a separate component with DateValue[] semantics.'
        wrong_pattern: |
          <DateField selectionMode="range" bind:value={range} />
        correct_pattern: |
          let range = $state<DateValue[]>([]);
          <DateRangeField bind:value={range} />
        source: 'existing form reference'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Manually duplicating Field error text'
        mechanism: 'When form and field are passed to Field.Root, it derives invalid/required state and renders the first error automatically.'
        wrong_pattern: |
          <Field.Root {form} field="email" invalid={form.invalid('email')}>
            <Field.ErrorText>{form.errors.email[0]}</Field.ErrorText>
          </Field.Root>
        correct_pattern: |
          <Field.Root {form} field="email" helperText="We'll never share your email.">
            <Field.Label>Email</Field.Label>
            <Field.Input bind:value={email} type="email" />
          </Field.Root>
        source: 'src/lib/components/field/field.svelte, existing form reference'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'Binding PhoneInput as local text'
        mechanism: 'PhoneInput stores and emits E.164 values, with country and valid as separate bindables.'
        wrong_pattern: |
          <PhoneInput bind:value={displayPhone} />
        correct_pattern: |
          <PhoneInput bind:value={e164Phone} bind:country bind:valid />
        source: 'existing form reference'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'Overlays and floating UI'
    slug: 'overlays-and-floating-ui'
    domain: 'using-component-groups'
    description: 'Compose modal and floating UI with Dialog, AlertDialog, Drawer, Menu, Popover, HoverCard, Tooltip, Toast, Portal, and open-state patterns.'
    type: 'core'
    covers:
      - 'Dialog namespace'
      - 'AlertDialog'
      - 'Drawer namespace'
      - 'Menu namespace'
      - 'Popover, HoverCard, Tooltip'
      - 'Toast singleton and Toaster'
      - 'Portal stacking and --layer-index'
    tasks:
      - 'Build confirm dialogs and alert dialogs'
      - 'Build drawers with scrollable body and footer actions'
      - 'Use menu items, radio items, checkbox items, context triggers, and submenus'
      - 'Show popovers and hover cards with controlled or uncontrolled state'
      - 'Configure app-level toast rendering'
    failure_modes:
      - mistake: 'Expecting Dialog onClose prop'
        mechanism: 'Dialog exposes open binding and onOpenChange, not an onClose callback.'
        wrong_pattern: |
          <Dialog.Root bind:open onClose={handleClose}>...</Dialog.Root>
        correct_pattern: |
          <Dialog.Root
            bind:open
            onOpenChange={(details) => {
              if (!details.open) handleClose();
            }}
          >
            ...
          </Dialog.Root>
        source: 'existing images reference note, dialog implementation'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Manually composing Drawer backdrop'
        mechanism: 'Drawer.Content internally renders backdrop and positioner for common cases.'
        wrong_pattern: |
          <Drawer.Backdrop />
          <Drawer.Positioner>
            <Drawer.Content>...</Drawer.Content>
          </Drawer.Positioner>
        correct_pattern: |
          <Drawer.Content>
            <Drawer.Header>...</Drawer.Header>
            <Drawer.Body>...</Drawer.Body>
          </Drawer.Content>
        source: 'existing overlay reference'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'Forgetting app-level Toaster'
        mechanism: 'Toast helpers create notifications, but Toast.Toaster must be rendered once to display them.'
        wrong_pattern: |
          import { toast } from 'compote-ui';
          toast.success('Saved');
        correct_pattern: |
          <!-- +layout.svelte -->
          <Toast.Toaster />
          {@render children()}
        source: 'existing overlay reference'
        priority: 'HIGH'
        status: 'active'

  - name: 'Layout and display'
    slug: 'layout-and-display'
    domain: 'using-component-groups'
    description: 'Compose layout, display, and interaction primitives such as Card, Tabs, Splitter, Collapsible, ScrollArea, Avatar, Carousel, TreeView, JsonTreeView, QR Code, Toggle, and ToggleGroup.'
    type: 'core'
    covers:
      - 'Card namespace'
      - 'Tabs namespace'
      - 'Splitter wrapper and Ark UI nested fallback'
      - 'Collapsible and ScrollArea'
      - 'Avatar, Carousel, TreeView, JsonTreeView, QrCode'
      - 'Toggle and ToggleGroup'
    tasks:
      - 'Build tabbed panels and scrollable areas'
      - 'Use Splitter for resizable panels'
      - 'Render display components with correct sizing constraints'
      - 'Build toggle buttons and grouped toggle controls'
      - 'Render tree and JSON inspectors'
    failure_modes:
      - mistake: 'Nesting Splitter wrapper'
        mechanism: 'Nested Ark UI splitters require a shared registry, which the wrapper cannot pass through snippets.'
        wrong_pattern: |
          <Splitter panels={[{ id: 'left', content: nestedSplitter }]} />
        correct_pattern: |
          import { Splitter } from '@ark-ui/svelte/splitter';
          const registry = Splitter.createRegistry();
          <Splitter.Root {registry}>...</Splitter.Root>
        source: 'existing layout reference'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Unconstrained ScrollArea or TreeView'
        mechanism: 'ScrollArea, TreeView, JsonTreeView, and table-like displays need a sized container for predictable scrolling.'
        wrong_pattern: |
          <ScrollArea.Root>
            <ScrollArea.Viewport>...</ScrollArea.Viewport>
          </ScrollArea.Root>
        correct_pattern: |
          <ScrollArea.Root class="h-80 w-56">
            <ScrollArea.Viewport>...</ScrollArea.Viewport>
          </ScrollArea.Root>
        source: 'existing layout and display references'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'Vertical carousel without height'
        mechanism: 'Vertical carousel needs an explicit root height so the viewport is constrained.'
        wrong_pattern: |
          <Carousel.Root orientation="vertical" slideCount={items.length}>
        correct_pattern: |
          <Carousel.Root orientation="vertical" class="h-[512px]" slideCount={items.length}>
        source: 'existing display reference'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'Files and images'
    slug: 'files-and-images'
    domain: 'using-component-groups'
    description: 'Build file upload and image crop flows with FileUpload, ImageCropper, ImageCropDialog, and Canvas-based image processing utilities.'
    type: 'core'
    covers:
      - 'FileUpload and FileUploadDropzone'
      - 'ImageCropper'
      - 'ImageCropDialog'
      - 'loadImage, fileToDataUrl, cropImage, processImage'
      - 'Blob, FormData, object URL lifecycle'
      - 'browser-only Canvas constraints'
    tasks:
      - 'Build an image upload and crop workflow'
      - 'Convert files to data URLs for preview/cropping'
      - 'Process or crop images before upload'
      - 'Configure allowed file types and file counts'
    failure_modes:
      - mistake: 'Calling image utilities during SSR'
        mechanism: 'The utilities use Image, FileReader, document, canvas, and Blob APIs that exist only in the browser.'
        wrong_pattern: |
          export const load = async () => {
            return { image: await processImage(src) };
          };
        correct_pattern: |
          async function handleFile(file: File) {
            const src = await fileToDataUrl(file);
            const blob = await processImage(src);
          }
        source: 'src/lib/utils/image-processing.ts'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Using display-resolution crop output'
        mechanism: 'Ark UI getCroppedImage returns display-resolution output; Compote cropImage/getProcessedImage uses natural pixel coordinates.'
        wrong_pattern: |
          const blob = await getCroppedImage();
        correct_pattern: |
          const blob = await getProcessedImage?.({ maxWidth: 1200 });
        source: 'existing images reference, src/lib/components/image-cropper/image-cropper.svelte'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Leaking object URLs'
        mechanism: 'Preview URLs created from processed Blobs should be revoked when replaced or removed.'
        wrong_pattern: |
          previewUrl = URL.createObjectURL(blob);
        correct_pattern: |
          if (previewUrl) URL.revokeObjectURL(previewUrl);
          previewUrl = URL.createObjectURL(blob);
        source: 'existing images reference'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'Data table'
    slug: 'data-table'
    domain: 'building-data-tables'
    description: 'Build tables with the compote-ui/data-table subpath, column helper, createTable wrapper, toolbar controls, row selection, filters, formatting, and optional virtualization.'
    type: 'composition'
    covers:
      - 'compote-ui/data-table subpath'
      - 'createDataTableColumnHelper'
      - 'createTable'
      - 'DataTable.Root, Toolbar, Title, Search, ColumnFilter, ColumnVisibility'
      - 'column types and type defaults'
      - 'TanStack Table v9 feature registry'
      - 'compote-ui/data-table/virtual and @tanstack/svelte-virtual'
    tasks:
      - 'Define typed data table columns'
      - 'Render searchable/filterable/selectable/resizable tables'
      - 'Use custom cell renderers, components, or snippets'
      - 'Make data and columns reactive'
      - 'Use virtualized rows for large datasets'
    reference_candidates:
      - topic: 'data table column options and cell rendering'
        reason: 'The table has a dense API surface with many options, render modes, and type defaults.'
    failure_modes:
      - mistake: 'Missing id for accessorFn column'
        mechanism: 'Columns built from accessorFn cannot derive a stable column id from a key.'
        wrong_pattern: |
          col.accessorFn((row) => row.a + row.b, { header: 'Total' })
        correct_pattern: |
          col.accessorFn((row) => row.a + row.b, { id: 'total', header: 'Total' })
        source: 'src/lib/components/data-table-v9/create-table.svelte.ts, existing data-table reference'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Non-reactive reassigned columns'
        mechanism: 'Reassigned columns must be passed through a getter and stored with $state.raw to preserve identity.'
        wrong_pattern: |
          let columns = $state([idCol, nameCol]);
          const table = DataTable.createTable({ data, columns });
        correct_pattern: |
          let columns = $state.raw([idCol, nameCol]);
          const table = DataTable.createTable({
            get data() { return rows; },
            get columns() { return columns; }
          });
        source: 'existing data-table reference, src/routes/components/data-table-v9/+page.svelte'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Rendering table without height constraint'
        mechanism: 'DataTable.Root fills its container and uses internal scrolling; without a constrained height layout can overflow unpredictably.'
        wrong_pattern: |
          <DataTable.Root {table} />
        correct_pattern: |
          <div class="h-96 min-h-0">
            <DataTable.Root {table} caption="Invoices" />
          </div>
        source: 'existing data-table reference, src/lib/components/data-table-v9/data-table.svelte'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Importing virtual table without optional peer'
        mechanism: 'The virtual subpath imports @tanstack/svelte-virtual internally and requires that optional peer when used.'
        wrong_pattern: |
          import * as VirtualDataTable from 'compote-ui/data-table/virtual';
          // package lacks @tanstack/svelte-virtual
        correct_pattern: |
          bun add @tanstack/svelte-virtual
          import * as VirtualDataTable from 'compote-ui/data-table/virtual';
        source: 'package.json peerDependenciesMeta, src/lib/components/data-table-v9/virtual/data-table-virtual-rows.svelte'
        priority: 'HIGH'
        status: 'active'

  - name: 'Production checklist'
    slug: 'production-checklist'
    domain: 'shipping-safely'
    description: 'Audit a Compote UI integration before shipping: peers, SSR boundaries, theme import, accessibility, optional packages, and verification commands.'
    type: 'lifecycle'
    covers:
      - 'peer dependency audit'
      - 'theme.css and Tailwind setup'
      - 'browser-only utility audit'
      - 'component accessibility checks'
      - 'data-table optional peer checks'
      - 'bun run check and bun run lint'
    tasks:
      - 'Review production readiness of a consuming app'
      - 'Check optional peer dependencies for used components'
      - 'Find SSR-unsafe image processing calls'
      - 'Run repository verification before commit or release'
    failure_modes:
      - mistake: 'Skipping local verification'
        mechanism: 'The repository expects Svelte type checking and linting after changes.'
        wrong_pattern: |
          git commit -m "change component"
        correct_pattern: |
          bun run check
          bun run lint
        source: 'repo-local verify skill, CLAUDE.md'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Assuming charts and editors are included'
        mechanism: 'Charts and TipTap editor functionality live in separate libraries and should be excluded from compote-ui skills.'
        wrong_pattern: |
          import { Chart, RichTextEditor } from 'compote-ui';
        correct_pattern: |
          // Charts: compote-echart
          // Editor: compote-editor
        source: 'maintainer interview'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'Forgetting component-specific peer dependencies'
        mechanism: 'Some components depend on peers or side-effect CSS only when the component is used.'
        wrong_pattern: |
          import * as VirtualDataTable from 'compote-ui/data-table/virtual';
          // no @tanstack/svelte-virtual installed
        correct_pattern: |
          bun add @tanstack/svelte-virtual
        source: 'package.json, maintainer interview'
        priority: 'HIGH'
        status: 'active'

